plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
    min_valid_ratio: 0.01
    min_valid_pixels: 0
    ignore_index: 255
    fallback: "skip"

  efficient_tam_memory:
    enabled: true
    mode: "pool"
    compress_ratio: 0.5
    pool_stride: 2
    apply_in_pl: true
    apply_in_train: true

  efficient_sam2_sparse:
    enabled: true
    mode: "attn_topk"
    keep_ratio: 0.5
    min_keep_tokens: 64
    saliency_source: "feature_norm"
    cache_saliency: true
    fallback_full_when_uncertain: true
    apply_in_pl: true
    apply_in_train: true

