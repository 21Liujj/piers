plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
    min_valid_ratio: 0.01
    min_valid_pixels: 0
    ignore_index: 255
    fallback: "skip"
  efficient_tam_memory:
    enabled: true
    mode: "pool"
    compress_ratio: 0.5
    pool_stride: 2
    apply_in_pl: false
    apply_in_train: true
  efficient_sam2_sparse:
    enabled: true
    mode: "attn_topk"
    keep_ratio: 0.5
    min_keep_tokens: 64
    saliency_source: "feature_norm"
    cache_saliency: true
    fallback_full_when_uncertain: true
    apply_in_pl: false
    apply_in_train: true

use_text_proto: true
text_proto_path: assets/text_prototypes_openclip_text_latest.pt
text_proto_mode: random
text_proto_random_seed: 0
use_text_gate_ssl: false
lambda_txt: 0.1
weight_txt_align: 0.05
txt_tau: 0.07
txt_align_tau: 1.0
text_train_stage: stage2
text_fusion_alpha_init: 0.0
text_fusion_alpha_learnable: true
