multimodal:
  use_text_proto: true

text_proto:
  path: assets/text_prototypes_openclip_text_latest.pt
  mode: random
  normalize: true
  shuffle_seed: 0
  random_seed: 0

text_adapter:
  enabled: true
  hidden_dim: 512
  dropout: 0.0
  normalize_output: true
  zero_init_last: false

text_fusion:
  enabled: true
  type: image_to_text_cross_attn
  num_heads: 4
  dropout: 0.0
  beta_init: 0.05
  beta_learnable: true
  beta_max: null
  use_ffn: true
  ffn_ratio: 4.0
  norm_visual: true
  norm_text: true
  return_attn: false
  log_every: 20
  save_debug_vis: false
  save_vis_num: 20

text_gate:
  enabled: false

weight_txt_align: 0.02
lambda_txt: 0.0
text_train_stage: stage2
