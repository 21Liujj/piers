dataset: "Cityscapes"
class_set: 13
backbone: "sam2_s"
data_root: "data"

# Training schedule (ablation)
num_epochs: 1
batch_size: 2
amp: true
tf32: true

# Pseudo-label generation schedule (fixed50)
warmup_pl: 50
iters_pl: 50
pl_shuffle: false
pl_num_workers: 0

# Optional subset file will be injected by launcher script:
# pl_subset_file: "scripts/time_ablation/subsets/wildpass_fixed50_seed0.txt"

plugins:
  pseudo_conf_mask:
    enabled: false
  efficient_tam_memory:
    enabled: false
  efficient_sam2_sparse:
    enabled: false
  depth_boundary_prior:
    enabled: false

