# Final optimized indoor plugins (matches configs/extra_exp/wildpass/wildpass_train_final_optimized.yaml toggles).
dataset: Stanford2D3D
class_set: 13
backbone: sam2_s
data_root: data
stanford_processed_root: data_extra/processed/Stanford360_SPAN8
stanford_flat_layout: true
stanford_legacy_area_crop: false

num_epochs: 1
batch_size: 4
train_max_iters: 500
amp: true
tf32: true

warmup_pl: 50
iters_pl: 50
pl_shuffle: false
pl_num_workers: 0

plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
    min_valid_ratio: 0.01
    min_valid_pixels: 0
    ignore_index: 255
    fallback: "skip"
  efficient_tam_memory:
    enabled: true
    mode: "pool"
    compress_ratio: 0.5
    pool_stride: 2
    apply_in_pl: true
    apply_in_train: true
  efficient_sam2_sparse:
    enabled: true
    mode: "attn_topk"
    keep_ratio: 0.5
    min_keep_tokens: 64
    saliency_source: "feature_norm"
    cache_saliency: true
    fallback_full_when_uncertain: true
    apply_in_pl: true
    apply_in_train: true
  depth_boundary_prior:
    enabled: false
