# Machine-local path configuration — NEVER commit real values.
#
# Copy this file to `configs/piers/paths.yaml` on a new machine and edit it.
# `paths.yaml` is git-ignored. Every committed config/manifest uses
# ${PIERS_*} placeholders that are expanded at load time by
# `src/piers_ljj/paths.py` (see `resolve()` / `load_manifest()`).
#
# Precedence: explicit overrides > environment variables > paths.yaml > this file.

# Dataset root. Must contain the dataset subtrees below.
#   DensePASS/{leftImg8bit,gtFine}/...
#   WildPASS/..., SynPASS/..., Cityscapes/...
data_root: "${PIERS_DATA_ROOT}"

# Extra datasets kept outside the main dataset root.
#   WildPASS13/..., Stanford360_SPAN8/...
data_extra_root: "${PIERS_DATA_EXTRA_ROOT}"

# Model weights.
#   sam2.1_hiera_small.pt
#   grounding-dino-tiny-hf/   (converted dir, see scripts/piers/convert_grounding_ckpt.py)
weights_root: "${PIERS_WEIGHTS_ROOT}"

# The piers checkout itself (auto-detected; no need to set).
# repo_root: "/path/to/piers"

# Scratch/output root for experiment runs (auto-detected; default <repo>/runs).
# runs_root: "/path/to/piers/runs"

# --- legacy single-source keys (still honoured by scripts/piers/make_manifest.py) ---
omni_ckpt: ""            # e.g. omnisam_s.pth inside weights_root
omni_ckpt_sha256: ""     # optional; validate-data --sha256 verifies it
omni_src_root: ""        # Effective-Omnisam checkout (vendored under third_party/)
grounded_weights_dir: "" # raw grounding-dino download dir
grounded_hf_dir: ""      # CONVERTED dir (run convert_grounding_ckpt.py once)
sam2_ckpt: ""            # e.g. sam2.1_hiera_small.pt inside weights_root
sam2_cfg: "sam2_hiera_s.yaml"  # small; _l.yaml only if you have the large ckpt
manifest: "configs/piers/manifest.dev-calib.json"  # generated by scripts/piers/make_manifest.py
