[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piers-ljj"
version = "0.1.0"
description = "Text-specified efficient panoramic segmentation: UDA + grounded text branch"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "pillow>=10.0"]

[project.scripts]
piers_ljj = "piers_ljj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
